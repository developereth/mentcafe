<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Edit Menu</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0d0d0d;color:#fff;padding:20px}
        h1{color:#4CAF50;margin-bottom:20px}
        .section{margin-bottom:30px;background:#1a1a1a;padding:20px;border-radius:12px}
        .section h3{color:#4CAF50;margin-bottom:15px}
        .item-row{display:flex;gap:10px;margin-bottom:10px;align-items:center}
        .item-row input{padding:10px;border-radius:8px;border:1px solid #333;background:#0d0d0d;color:#fff;flex:1}
        .item-row input.price-input{max-width:120px}
        .btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin:5px}
        .btn-add{background:#4CAF50;color:#fff}
        .btn-del{background:#c0392b;color:#fff}
        .btn-save{background:#2E7D32;color:#fff;padding:15px 40px;font-size:1.1rem}
        button:hover{opacity:0.85}
    </style>
</head>
<body>
    <h1>🔧 Edit Menu</h1>
    <div id="adminContainer"></div>
    <button class="btn-save" onclick="saveMenu()">💾 Save Menu</button>
    <p style="margin-top:15px;color:#888">After saving, refresh menu.html to see changes</p>

<script>
const menuData = {
    food: {
        "WRAP":[{name:"Chicken Wrap",price:495},{name:"Beef Wrap",price:495},{name:"Tuna Wrap",price:400},{name:"Vegetable Wrap",price:300}],
        "BURGER":[{name:"Special Burger",price:695},{name:"Cheese Burger",price:540},{name:"Beef Burger",price:495}],
        "PIZZA":[{name:"Menata Pizza",price:695},{name:"Beef Pizza",price:650},{name:"Chicken Pizza",price:650},{name:"Tuna Pizza",price:495},{name:"Vegetable Pizza",price:400}],
        "WAKE UP CALL":[{name:"Chechebsa",price:300},{name:"Fetira",price:350},{name:"Full",price:250},{name:"Scrambled Egg",price:280},{name:"Egg Sandwich",price:300}],
        "SPAGHETTI":[{name:"Tuna Pasta",price:380},{name:"Pasta with Meat",price:400},{name:"Vegetable Pasta",price:280},{name:"Pasta with Tomato Sauce",price:280}],
        "ENJERA":[{name:"Shiro",price:380},{name:"Fasting Firfir",price:300},{name:"Tibs Firfir",price:450},{name:"Quanta Firfir",price:480}]
    },
    drinks: {
        "ESPRESSO LAB":[{name:"Macchiato",price:130},{name:"Café Latte",price:180},{name:"Espresso",price:90},{name:"Americano",price:90},{name:"Cappuccino",price:200},{name:"Tea",price:65},{name:"Ginger Tea",price:70},{name:"Lemon Tea",price:70},{name:"Green Tea",price:70}],
        "STAY COOL":[{name:"Iced Caramel Latte",price:340},{name:"Iced Chocolate",price:340},{name:"Strawberry Iced",price:340},{name:"Cinnamon Iced Latte",price:400},{name:"Iced Coffee",price:250}],
        "MINT & LIME":[{name:"Classic Virgin Mojito",price:400},{name:"Strawberry Mojito",price:380},{name:"Mango Mojito",price:350},{name:"Pineapple Mojito",price:350}],
        "JUICES":[{name:"Menata Mango",price:450},{name:"Mix Smoothie",price:450},{name:"Banana Date Protein",price:450},{name:"Avocado",price:280},{name:"Pineapple",price:300},{name:"Papaya",price:280},{name:"Mango",price:300}]
    }
};

const saved=localStorage.getItem('menataMenu');
if(saved){try{Object.assign(menuData,JSON.parse(saved))}catch(e){}}

function renderAdmin(){
    let html='';
    for(let type of ['food','drinks']){
        html+=`<h2 style="color:#4CAF50;margin:20px 0">${type.toUpperCase()}</h2>`;
        for(let[cat,items] of Object.entries(menuData[type])){
            html+=`<div class="section"><h3>${cat} <button class="btn btn-add" onclick="addItem('${type}','${cat}')">+ Add</button></h3>`;
            items.forEach((item,i)=>{
                html+=`<div class="item-row">
                    <input value="${item.name}" onchange="updateItem('${type}','${cat}',${i},'name',this.value)">
                    <input class="price-input" type="number" value="${item.price}" onchange="updateItem('${type}','${cat}',${i},'price',parseInt(this.value))">
                    <button class="btn btn-del" onclick="deleteItem('${type}','${cat}',${i})">✕</button>
                </div>`;
            });
            html+='</div>';
        }
    }
    document.getElementById('adminContainer').innerHTML=html;
}

function updateItem(type,cat,index,field,value){
    menuData[type][cat][index][field]=value;
}

function deleteItem(type,cat,index){
    menuData[type][cat].splice(index,1);
    renderAdmin();
}

function addItem(type,cat){
    menuData[type][cat].push({name:"New Item",price:0});
    renderAdmin();
}

function saveMenu(){
    localStorage.setItem('menataMenu',JSON.stringify(menuData));
    alert('Menu saved!');
}

renderAdmin();
</script>
</body>
</html>
