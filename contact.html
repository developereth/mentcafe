<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Menata Café</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--green:#2E7D32;--green-light:#4CAF50;--green-dark:#1B5E20;--bg:#0d0d0d;--dark:#1a1a1a}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff}
        nav{background:var(--dark);padding:12px 20px;border-bottom:2px solid var(--green-light);position:sticky;top:0;z-index:1000;display:flex;justify-content:space-between;align-items:center}
        .logo-circle{width:44px;height:44px;border-radius:50%;border:2px solid var(--green-light);background:var(--green);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:#fff;font-size:1.2rem;text-decoration:none}
        .nav-links{display:flex;gap:24px;list-style:none}
        .nav-links a{color:#bbb;text-decoration:none;font-size:0.9rem}
        .nav-links a:hover,.nav-links a.active{color:var(--green-light)}
        .menu-btn{display:none;background:none;border:none;color:var(--green-light);font-size:1.7rem}
        .section{padding:60px 20px;max-width:600px;margin:0 auto;text-align:center}
        .section-title{font-family:'Playfair Display',serif;font-size:2.4rem;margin-bottom:30px}
        .section-title span{color:var(--green-light)}
        .contact-info{background:var(--dark);padding:30px;border-radius:16px;border:1px solid #2a2a2a}
        .contact-info p{margin:15px 0;font-size:1.1rem}
        .contact-info i{color:var(--green-light);margin-right:10px;width:25px}
        .social-links{margin-top:30px;display:flex;gap:20px;justify-content:center}
        .social-links a{color:var(--green-light);font-size:2rem;transition:.3s}
        .social-links a:hover{color:#fff}
        footer{background:var(--dark);text-align:center;padding:35px 20px;border-top:1px solid #222;margin-top:40px}
        .footer-links{display:flex;gap:25px;justify-content:center}
        .footer-links a{color:#aaa;text-decoration:none}
        @media(max-width:768px){.nav-links{display:none}.menu-btn{display:block}}
    </style>
</head>
<body>
<nav>
    <a href="index.html" class="logo-circle">M</a>
    <ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="menu.html">Menu</a></li><li><a href="catering.html">Catering</a></li><li><a href="reviews.html">Reviews</a></li><li><a href="contact.html" class="active">Contact</a></li></ul>
    <button class="menu-btn" onclick="openMenu()"><i class="fas fa-bars"></i></button>
</nav>

<div class="section">
    <h2 class="section-title">Contact <span>Us</span></h2>
    <div class="contact-info">
        <p><i class="fas fa-map-marker-alt"></i> Bole, Addis Ababa, Ethiopia</p>
        <p><i class="fas fa-phone"></i> +251 91 234 5678</p>
        <p><i class="fas fa-envelope"></i> hello@menatacafe.com</p>
        <p><i class="fas fa-clock"></i> Open Daily: 7AM - 10PM</p>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
        </div>
    </div>
</div>

<footer><div class="footer-links"><a href="index.html">Home</a><a href="menu.html">Menu</a><a href="catering.html">Catering</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a></div><p>© 2026 Menata Café</p></footer>
<script>function openMenu(){document.getElementById('sideNav').classList.add('show');document.getElementById('overlay').classList.add('show')}function closeMenu(){document.getElementById('sideNav').classList.remove('show');document.getElementById('overlay').classList.remove('show')}</script>
</body>
</html>
