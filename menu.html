<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Menata Café</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--green:#2E7D32;--green-light:#4CAF50;--green-dark:#1B5E20;--bg:#0d0d0d;--dark:#1a1a1a}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff;line-height:1.5}
        nav{background:var(--dark);padding:12px 20px;border-bottom:2px solid var(--green-light);position:sticky;top:0;z-index:1000;display:flex;justify-content:space-between;align-items:center}
        .logo-circle{width:44px;height:44px;border-radius:50%;border:2px solid var(--green-light);background:var(--green);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:#fff;font-size:1.2rem;text-decoration:none}
        .nav-links{display:flex;gap:24px;list-style:none}
        .nav-links a{color:#bbb;text-decoration:none;font-size:0.9rem;font-weight:500;transition:.3s}
        .nav-links a:hover,.nav-links a.active{color:var(--green-light)}
        .menu-btn{display:none;background:none;border:none;color:var(--green-light);font-size:1.7rem;cursor:pointer}
        .side-nav{position:fixed;top:0;right:-300px;width:280px;height:100vh;background:var(--dark);z-index:1002;transition:.35s;padding:70px 30px 30px;border-left:1px solid #333}
        .side-nav.show{right:0}
        .side-nav a{display:block;color:#ccc;text-decoration:none;padding:14px 0;font-size:1.1rem;border-bottom:1px solid #2a2a2a}
        .side-nav a:hover{color:var(--green-light)}
        .side-nav .close-btn{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--green-light);font-size:1.8rem;cursor:pointer}
        .overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:1001}
        .overlay.show{display:block}

        .section{padding:60px 20px;max-width:1200px;margin:0 auto}
        .section-title{font-family:'Playfair Display',serif;font-size:2.4rem;text-align:center;margin-bottom:40px}
        .section-title span{color:var(--green-light)}

        /* Category Header */
        .menu-category{margin-bottom:50px}
        .menu-category-header{display:flex;align-items:center;gap:15px;margin-bottom:25px;padding-bottom:15px;border-bottom:2px solid var(--green-dark)}
        .menu-category-header img{width:60px;height:60px;border-radius:12px;object-fit:cover;border:2px solid var(--green)}
        .menu-category-header h3{font-size:1.5rem;color:var(--green-light)}
        .menu-category-header h3 i{margin-right:10px}

        /* Menu Items Grid with Images */
        .menu-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
        
        .menu-card-item{background:var(--dark);border-radius:14px;overflow:hidden;border:1px solid #2a2a2a;transition:.3s;display:flex;align-items:center;gap:15px;padding-right:15px}
        .menu-card-item:hover{border-color:var(--green);transform:translateY(-3px);box-shadow:0 10px 25px rgba(46,125,50,0.2)}
        
        .menu-card-item .item-img{width:90px;height:90px;object-fit:cover;flex-shrink:0;border-right:2px solid #222}
        .menu-card-item .item-img-placeholder{width:90px;height:90px;flex-shrink:0;background:linear-gradient(135deg,#1a2a1a,#0d1a0d);display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--green-light);border-right:2px solid #222}
        
        .menu-card-item .item-info{flex:1;min-width:0}
        .menu-card-item .item-name{font-weight:600;font-size:0.95rem;margin-bottom:6px;color:#fff}
        .menu-card-item .item-price{color:var(--green-light);font-weight:700;font-size:1.1rem;display:inline-block;background:rgba(46,125,50,0.15);padding:4px 12px;border-radius:20px}

        .promo{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;text-align:center;padding:18px 20px;border-radius:50px;margin:20px 0;font-weight:600}
        .section-divider{text-align:center;margin:40px 0;color:var(--green-light);font-size:2rem}

        footer{background:var(--dark);text-align:center;padding:35px 20px;border-top:1px solid #222;margin-top:40px}
        footer .footer-logo{width:50px;height:50px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:#fff;margin:0 auto 12px;font-size:1.3rem}
        footer p{color:#888;font-size:0.85rem;margin:8px 0}
        .footer-links{display:flex;gap:25px;justify-content:center;flex-wrap:wrap;margin:15px 0}
        .footer-links a{color:#aaa;text-decoration:none;font-size:0.85rem}
        .footer-links a:hover{color:var(--green-light)}
        .powered{color:#777;font-size:0.75rem;margin-top:15px}
        .powered a{color:#aaa;text-decoration:none}

        @media(max-width:768px){
            .nav-links{display:none}
            .menu-btn{display:block}
            .menu-items{grid-template-columns:1fr}
        }
    </style>
</head>

// ============================================
// 🎨 RENDER MENU WITH IMAGES
// ============================================
function renderMenu(){
    let html='<div style="text-align:center;margin-bottom:40px"><h3 style="color:var(--green-light);font-size:2rem">🍽️ Food Menu</h3></div>';

    // Render Food
    for(let[cat,items] of Object.entries(menuData.food)){
        const catImg = categoryImages[cat] || 'https://via.placeholder.com/120/1a3a1a/4CAF50?text='+encodeURIComponent(cat);
        html+=`
        <div class="menu-category">
            <div class="menu-category-header">
                <img src="${catImg}" alt="${cat}" loading="lazy" onerror="this.style.display='none'">
                <h3><i class="${icons[cat]||'fa-solid fa-utensils'}"></i> ${cat}</h3>
            </div>
            <div class="menu-items">`;
        
        items.forEach(item=>{
            const itemImg = item.image || 'https://via.placeholder.com/200/1a3a1a/4CAF50?text='+encodeURIComponent(item.name);
            html+=`
            <div class="menu-card-item">
                <img src="${itemImg}" alt="${item.name}" class="item-img" loading="lazy" onerror="this.parentElement.querySelector('.item-img-placeholder').style.display='flex';this.style.display='none'">
                <div class="item-img-placeholder" style="display:none"><i class="${icons[cat]||'fas fa-utensils'}"></i></div>
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price} ETB</div>
                </div>
            </div>`;
        });
        html+='</div></div>';
    }

    html+='<div class="section-divider">🍃 🍃 🍃</div>';
    html+='<div style="text-align:center;margin-bottom:40px"><h3 style="color:var(--green-light);font-size:2rem">🥤 Drinks Menu</h3></div>';

    // Render Drinks
    for(let[cat,items] of Object.entries(menuData.drinks)){
        const catImg = categoryImages[cat] || 'https://via.placeholder.com/120/1a3a1a/4CAF50?text='+encodeURIComponent(cat);
        html+=`
        <div class="menu-category">
            <div class="menu-category-header">
                <img src="${catImg}" alt="${cat}" loading="lazy" onerror="this.style.display='none'">
                <h3><i class="${icons[cat]||'fa-solid fa-martini-glass'}"></i> ${cat}</h3>
            </div>
            <div class="menu-items">`;
        
        items.forEach(item=>{
            const itemImg = item.image || 'https://via.placeholder.com/200/1a3a1a/4CAF50?text='+encodeURIComponent(item.name);
            html+=`
            <div class="menu-card-item">
                <img src="${itemImg}" alt="${item.name}" class="item-img" loading="lazy" onerror="this.parentElement.querySelector('.item-img-placeholder').style.display='flex';this.style.display='none'">
                <div class="item-img-placeholder" style="display:none"><i class="${icons[cat]||'fas fa-utensils'}"></i></div>
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price} ETB</div>
                </div>
            </div>`;
        });
        html+='</div></div>';
    }

    document.getElementById('menuContainer').innerHTML=html;
}

// Load saved menu from localStorage if exists (from admin panel)
const saved=localStorage.getItem('menataMenu');
if(saved){
    try{
        const parsed=JSON.parse(saved);
        // Merge saved data (preserves images if not overwritten)
        for(let type of ['food','drinks']){
            if(parsed[type]){
                for(let cat in parsed[type]){
                    if(menuData[type][cat]){
                        menuData[type][cat] = parsed[type][cat].map((savedItem,i)=>{
                            const originalItem = menuData[type][cat][i] || {};
                            return {
                                name: savedItem.name || originalItem.name,
                                price: savedItem.price || originalItem.price,
                                image: savedItem.image || originalItem.image || 'https://via.placeholder.com/200/1a3a1a/4CAF50?text='+encodeURIComponent(savedItem.name||'Item')
                            };
                        });
                    }
                }
            }
        }
    }catch(e){console.log('Error loading saved menu:',e)}
}

renderMenu();
</script>
