<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Menata Café</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--gold:#C8A96E;--dark:#1a1a1a;--bg:#0d0d0d}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff}
        nav{background:var(--dark);padding:12px 20px;border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:1000;display:flex;justify-content:space-between;align-items:center}
        .logo-circle{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:var(--dark);font-size:0.7rem;text-decoration:none}
        .nav-links{display:flex;gap:20px;list-style:none}
        .nav-links a{color:#bbb;text-decoration:none;font-size:0.85rem}.nav-links a:hover,.nav-links a.active{color:var(--gold)}
        .menu-btn{display:none;background:none;border:none;color:var(--gold);font-size:1.5rem;cursor:pointer}
        .side-nav{position:fixed;top:0;right:-280px;width:280px;height:100vh;background:var(--dark);z-index:1002;transition:0.3s;padding:60px 30px;border-left:1px solid #333}
        .side-nav.show{right:0}.side-nav a{display:block;color:#bbb;text-decoration:none;padding:12px 0;font-size:1rem;border-bottom:1px solid #222}
        .side-nav .close-btn{position:absolute;top:15px;right:20px;background:none;border:none;color:var(--gold);font-size:1.5rem;cursor:pointer}
        .overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1001}.overlay.show{display:block}
        .header{background:linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.5)),url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1600') center/cover;padding:60px 20px;text-align:center}
        .header h1{font-family:'Playfair Display',serif;font-size:2.5rem;color:var(--gold)}.header a{color:var(--gold)}
        .container{max-width:900px;margin:0 auto;padding:20px 15px}
        .filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:25px}
        .filters button{padding:8px 16px;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:20px;cursor:pointer;font-size:0.8rem;font-weight:600}
        .filters button.active{background:var(--gold);color:var(--dark)}
        .menu-section{margin-bottom:30px}
        .menu-section h2{color:var(--gold);font-family:'Playfair Display',serif;font-size:1.5rem;margin-bottom:15px;padding-bottom:8px;border-bottom:1px solid #333}
        .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
        .menu-item{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:var(--dark);border-radius:8px;border:1px solid #222}
        .menu-item .name{font-weight:500}.menu-item .price{color:var(--gold);font-weight:700;font-size:1.1rem;white-space:nowrap}
        .menu-item .desc{color:#888;font-size:0.75rem}
        footer{background:var(--dark);text-align:center;padding:30px;border-top:1px solid #222;margin-top:40px}
        footer .footer-logo{width:50px;height:50px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:var(--dark);margin:0 auto 10px}
        footer p{color:#888;font-size:0.8rem;margin:5px 0}
        .footer-links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:10px 0}.footer-links a{color:#888;text-decoration:none;font-size:0.8rem}
        .powered{color:#666;font-size:0.7rem;margin-top:10px}.powered a{color:#888}
        @media(max-width:768px){.nav-links{display:none}.menu-btn{display:block}.menu-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<nav><a href="index.html" class="logo-circle">M</a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="menu.html" class="active">Menu</a></li><li><a href="catering.html">Catering</a></li><li><a href="reviews.html">Reviews</a></li><li><a href="contact.html">Contact</a></li></ul><button class="menu-btn" onclick="openMenu()"><i class="fas fa-bars"></i></button></nav>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="side-nav" id="sideNav"><button class="close-btn" onclick="closeMenu()"><i class="fas fa-times"></i></button><a href="index.html">Home</a><a href="menu.html">Menu</a><a href="catering.html">Catering</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a></div>
<div class="header"><h1>Our Menu</h1><p><a href="index.html">Home</a> / Menu</p></div>
<div class="container"><div class="filters"><button class="active" onclick="filter('all')">All</button><button onclick="filter('wrap')">Wrap</button><button onclick="filter('burger')">Burger</button><button onclick="filter('pizza')">Pizza</button><button onclick="filter('breakfast')">Breakfast</button><button onclick="filter('spaghetti')">Spaghetti</button><button onclick="filter('enjera')">Enjera</button><button onclick="filter('coffee')">Coffee</button><button onclick="filter('cool')">Stay Cool</button><button onclick="filter('mojito')">Mojito</button><button onclick="filter('juice')">Juices</button></div><div id="menuContainer">Loading...</div></div>
<footer><div class="footer-logo">M</div><div class="footer-links"><a href="index.html">Home</a><a href="menu.html">Menu</a><a href="catering.html">Catering</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a></div><p>© 2026 Menata Café. All rights reserved.</p><p class="powered">Powered by <a href="https://addispower.pages.dev" target="_blank">AddisPower</a></p></footer>
<script>
function openMenu(){document.getElementById('sideNav').classList.add('show');document.getElementById('overlay').classList.add('show')}
function closeMenu(){document.getElementById('sideNav').classList.remove('show');document.getElementById('overlay').classList.remove('show')}
var all=[],cat="all";
fetch("YOUR_WORKER_URL/api/menu").then(r=>r.json()).then(d=>{all=d.items||[];show()});
function filter(c){cat=c;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');show()}
function show(){var f=cat==="all"?all:all.filter(i=>i.category===cat);var c=document.getElementById('menuContainer');if(!f.length){c.innerHTML='<p style="text-align:center;color:#888;padding:40px">No items found</p>';return}var cats={};f.forEach(i=>{if(!cats[i.category])cats[i.category]=[];cats[i.category].push(i)});var h='';for(var k in cats){h+='<div class="menu-section"><h2>'+k.toUpperCase()+'</h2><div class="menu-grid">';cats[k].forEach(i=>{h+='<div class="menu-item"><div><div class="name">'+i.name+'</div>'+(i.desc?'<div class="desc">'+i.desc+'</div>':'')+'</div><div class="price">'+i.price+' ETB</div></div>'});h+='</div></div>'}c.innerHTML=h}
</script>
</body>
</html>
